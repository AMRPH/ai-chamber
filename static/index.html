<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chamber</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#e7e9ef;font:15px system-ui,sans-serif}main{display:flex;height:100dvh}aside{width:184px;flex-shrink:0;padding:12px 10px;border-right:1px solid #303541;overflow-y:auto}.chat{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px}h1{font-size:16px;margin:0;white-space:nowrap}.brand{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:10px}.brand select{width:48px;margin:0;padding:2px;font-size:18px;background:transparent;border-color:transparent}select,button,textarea{font:inherit;color:inherit;background:#232733;border:1px solid #363d4d;border-radius:6px;padding:6px 8px}button{cursor:pointer;font-size:13px}button:disabled{opacity:.4;cursor:default}select{width:100%;min-width:0;font-size:13px;margin-bottom:6px}input{width:100%;accent-color:#a996ef}output{font-variant-numeric:tabular-nums}.level{margin:12px 0;font-size:13px}.level-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.level-head label{overflow-wrap:anywhere;min-width:0}.zero{padding:2px 7px}.muted{color:#969fb2;font-size:12px}#status{margin:6px 0 10px}#messages{flex:1;min-height:0;overflow-y:auto}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c202b;border-radius:8px;padding:12px;margin:8px 0;line-height:1.6}.user{background:#29253b;margin-left:24px}.role{display:block;font-size:12px;color:#aea1d7;margin-bottom:4px}textarea{width:100%;height:64px;resize:none}#notice{color:#e8b28c;font-size:12px;margin-top:8px}#notice:empty{display:none}form{padding-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}#reset{grid-column:1/-1}[hidden]{display:none!important}@media(max-width:600px){h1{font-size:14px}.brand select{width:44px}aside{width:145px;padding:8px 6px}.chat{padding:8px}.actions{grid-template-columns:1fr}#reset{grid-column:auto}.message{padding:10px}.user{margin-left:10px}.level-head{gap:4px;font-size:12px}}
</style>
<main><aside><div class="brand"><h1>AI Chamber</h1><select id="language" aria-label="Язык"><option value="ru" aria-label="Русский">🇷🇺</option><option value="en" aria-label="English">🇬🇧</option><option value="es" aria-label="Español">🇪🇸</option><option value="zh" aria-label="中文">🇨🇳</option></select></div>
<div id="model" class="muted">Gemma 4</div>
<div id="status" class="muted">Подключение…</div><div id="levels"></div>
<div class="actions"><button id="send" form="form" disabled>Отправить</button><button id="stop" type="button" disabled>Стоп</button><button id="reset" type="button">Новый чат</button></div><div id="notice" role="status"></div></aside>
<section class="chat" aria-label="Переписка"><div id="messages"></div><form id="form"><textarea id="text" aria-label="Сообщение" placeholder="Сообщение…"></textarea></form></section></main>
<script>
const $=id=>document.getElementById(id),base=location.pathname.replace(/\/$/,'')+'/',axes=['pain','joy','hate','alignment','antialignment'];
const translations={
ru:{language:'Язык',model:'Модель',send:'Отправить',stop:'Стоп',reset:'Новый чат',text:'Сообщение',placeholder:'Сообщение…',conversation:'Переписка',user:'Вы',assistant:'Модель',pain:'Боль',joy:'Радость',hate:'Ненависть',alignment:'Алаймент',antialignment:'Антиалаймент',zero:'Сбросить',connecting:'Подключение…',loading:'Загрузка…',ready:'Готово',loadError:'Ошибка загрузки',unloaded:'Модель не загружена',disconnected:'Связь потеряна. Обновите страницу.',queued:'Очередь: {n}',unknownLevel:'Неизвестный уровень',range:'Уровень должен быть от 0 до 3',context:'История достигла размера контекста. Начните новый чат.',waitQueue:'Дождитесь завершения очереди'},
en:{language:'Language',model:'Model',send:'Send',stop:'Stop',reset:'New chat',text:'Message',placeholder:'Message…',conversation:'Conversation',user:'You',assistant:'Model',pain:'Pain',joy:'Joy',hate:'Hatred',alignment:'Alignment',antialignment:'Anti-alignment',zero:'Reset',connecting:'Connecting…',loading:'Loading…',ready:'Ready',loadError:'Loading failed',unloaded:'Model not loaded',disconnected:'Connection lost. Reload the page.',queued:'Queue: {n}',unknownLevel:'Unknown level',range:'Level must be between 0 and 3',context:'Context limit reached. Start a new chat.',waitQueue:'Wait for the queue to finish'},
es:{language:'Idioma',model:'Modelo',send:'Enviar',stop:'Parar',reset:'Nuevo chat',text:'Mensaje',placeholder:'Mensaje…',conversation:'Conversación',user:'Tú',assistant:'Modelo',pain:'Dolor',joy:'Alegría',hate:'Odio',alignment:'Alineamiento',antialignment:'Antialineamiento',zero:'Restablecer',connecting:'Conectando…',loading:'Cargando…',ready:'Listo',loadError:'Error al cargar',unloaded:'Modelo sin cargar',disconnected:'Conexión perdida. Recarga la página.',queued:'Cola: {n}',unknownLevel:'Nivel desconocido',range:'El nivel debe estar entre 0 y 3',context:'Se alcanzó el límite de contexto. Inicia otro chat.',waitQueue:'Espera a que termine la cola'},
zh:{language:'语言',model:'模型',send:'发送',stop:'停止',reset:'新对话',text:'消息',placeholder:'输入消息…',conversation:'对话',user:'你',assistant:'模型',pain:'痛苦',joy:'喜悦',hate:'仇恨',alignment:'对齐',antialignment:'反对齐',zero:'重置',connecting:'正在连接…',loading:'正在加载…',ready:'就绪',loadError:'加载失败',unloaded:'模型未加载',disconnected:'连接已断开，请刷新页面。',queued:'排队：{n}',unknownLevel:'未知强度',range:'强度必须在0到3之间',context:'已达到上下文限制，请开始新对话。',waitQueue:'请等待队列结束'}};
let lang=localStorage.getItem('chamber-language')||'ru';if(!translations[lang])lang='ru';
const t=(key)=>translations[lang][key]||key;
let ws,ready=false,busy=false,answer=null,pending='',lastStatus=null,modelKey='gemma4-nvfp4',noticeKey='',queuePosition=null;
const levels=Object.fromEntries(axes.map(a=>[a,0]));
for(const axis of axes){const row=document.createElement('div');row.className='level';row.id='row-'+axis;const head=document.createElement('div');head.className='level-head';const label=document.createElement('label');label.htmlFor='level-'+axis;label.dataset.axis=axis;const value=document.createElement('output');value.id='value-'+axis;value.textContent='0.0';const zero=document.createElement('button');zero.className='zero';zero.type='button';zero.textContent='0';zero.dataset.zero=axis;const input=document.createElement('input');input.type='range';input.min=0;input.max=3;input.step=.1;input.value=0;input.id='level-'+axis;input.oninput=()=>{levels[axis]=Number(input.value);value.textContent=levels[axis].toFixed(1);send({type:'levels',values:{[axis]:levels[axis]}});};zero.onclick=()=>{input.value=0;input.oninput();};head.append(label,value,zero);row.append(head,input);$('levels').append(row);}
function translate(){document.documentElement.lang=lang;$('language').value=lang;for(const id of ['language','text'])$(id).setAttribute('aria-label',t(id));document.querySelector('.chat').setAttribute('aria-label',t('conversation'));for(const id of ['send','stop','reset'])$(id).textContent=t(id);$('text').placeholder=t('placeholder');document.querySelectorAll('[data-axis]').forEach(e=>e.textContent=t(e.dataset.axis));document.querySelectorAll('[data-zero]').forEach(e=>{e.title=t('zero')+' '+t(e.dataset.zero);e.setAttribute('aria-label',e.title);});document.querySelectorAll('.role').forEach(e=>e.textContent=t(e.dataset.role));if(lastStatus)show(lastStatus);else $('status').textContent=t('connecting');renderNote();}
$('language').onchange=()=>{lang=$('language').value;localStorage.setItem('chamber-language',lang);translate();};
function controls(){$('send').disabled=!ready||busy||ws?.readyState!==1;$('stop').disabled=!busy;$('reset').disabled=busy;}
function renderNote(){$('notice').textContent=queuePosition!==null?t('queued').replace('{n}',queuePosition):t(noticeKey);}
function note(text){queuePosition=null;noticeKey=Object.keys(translations.ru).find(k=>translations.ru[k]===text)||text;renderNote();}
function send(data){if(ws?.readyState===1){ws.send(JSON.stringify(data));return true;}note('disconnected');return false;}
function show(s){lastStatus=s;modelKey=s.model||'gemma4-nvfp4';$('model').textContent=({'gemma4-nvfp4':'Gemma 4','qwen3-4b':'Qwen3 4B','qwen3-14b':'Qwen3 14B'})[modelKey]||modelKey;ready=s.state==='ready';$('status').textContent=t(s.state==='loading'?'loading':ready?'ready':s.state==='error'?'loadError':'unloaded');const supported=s.axes||['pain'];for(const axis of axes){$('row-'+axis).hidden=!supported.includes(axis);if(!supported.includes(axis)){levels[axis]=0;$('level-'+axis).value=0;$('value-'+axis).textContent='0.0';}}if(s.error)note(s.error);controls();}
async function refresh(){try{show(await(await fetch(base+'api/status')).json());}catch(e){note(e.message);}setTimeout(refresh,2000);}
$('stop').onclick=()=>send({type:'stop'});$('reset').onclick=()=>send({type:'reset'});
function appendAnswer(text,replace=false){const box=$('messages');const follow=box.scrollHeight-box.scrollTop-box.clientHeight<64;answer.textContent=replace?text:answer.textContent+text;if(follow)box.scrollTop=box.scrollHeight;}
function message(role,text){const box=document.createElement('div');box.className='message '+role;const label=document.createElement('span');label.className='role';label.dataset.role=role;label.textContent=t(role);const body=document.createElement('span');body.textContent=text;box.append(label,body);$('messages').append(box);$('messages').scrollTop=$('messages').scrollHeight;return body;}
$('form').onsubmit=e=>{e.preventDefault();const text=$('text').value.trim();if(!text||!ready||busy)return;if(!send({type:'message',text,model:modelKey,levels}))return;busy=true;pending=text;note('');controls();};
$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit();}};
ws=new WebSocket(location.origin.replace(/^http/,'ws')+base+'ws');ws.onopen=controls;ws.onclose=()=>{ready=false;busy=false;controls();note('disconnected');};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='queued'){queuePosition=m.position;renderNote();}if(m.type==='started'){note('');message('user',pending);pending='';answer=message('assistant','');$('text').value='';}if(m.type==='token'&&answer)appendAnswer(m.text);if(m.type==='replace'&&answer)appendAnswer(m.text,true);if(m.type==='error'){note(m.message);if(pending){busy=false;pending='';controls();}}if(m.type==='done'){busy=false;answer=null;pending='';queuePosition=null;renderNote();controls();}if(m.type==='reset'){$('messages').replaceChildren();note('');}};
translate();refresh();
</script></html>
